<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendPulse - AI-Powered Expense Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --input-bg: #f8fafc;
            --item-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --input-bg: #0f172a;
            --item-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* AI Insights Banner */
        .ai-banner {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.1) 0%, rgba(99, 102, 241, 0.05) 100%);
            border: 1px solid rgba(79, 70, 229, 0.2);
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ai-icon {
            font-size: 24px;
            background: var(--primary);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ai-text h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .ai-text p {
            font-size: 13px;
            color: var(--text-main);
            opacity: 0.9;
        }

        .balance-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 220px;
            background: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
        }
        .balance-card::after { background: var(--primary); }
        .income-card::after { background: #10b981; }
        .expense-card::after { background: #ef4444; }

        .card h4 { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .card p { font-size: 24px; font-weight: 700; color: var(--text-main); }

        /* Progress Bar Ratio */
        .progress-container {
            background: var(--card-bg);
            padding: 18px 22px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .progress-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bar {
            background: var(--border-color);
            border-radius: 8px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            display: flex;
        }

        .progress-income { background: #10b981; height: 100%; transition: width 0.4s ease; }
        .progress-expense { background: #ef4444; height: 100%; transition: width 0.4s ease; }

        .main-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 25px;
        }

        @media (max-width: 920px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        .card-box h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: var(--primary-hover); }

        /* Category Breakdown */
        .category-breakdown {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .cat-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .cat-item strong { color: var(--text-main); }

        .transaction-list {
            list-style: none;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid #ccc;
            font-size: 14px;
        }
        .transaction-item.income { border-left-color: #10b981; }
        .transaction-item.expense { border-left-color: #ef4444; }
        
        .trans-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .trans-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .trans-category {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--border-color);
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
        }

        .trans-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.2s;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.2); }

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #10b981;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            display: none;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <div class="logo">
            <span>💳</span> SpendPulse Portal
        </div>
        <div class="header-actions">
            <button class="btn-secondary" onclick="exportToCSV()">📥 Export CSV</button>
            <button class="btn-secondary" id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>
    </header>

    <!-- AI Financial Advisor Banner -->
    <div class="ai-banner">
        <div class="ai-icon">✨</div>
        <div class="ai-text">
            <h4>AI Financial Advisor</h4>
            <p id="aiInsightText">Analyzing financial transactions and spending health...</p>
        </div>
    </div>

    <!-- Balance Summary Cards -->
    <div class="balance-box">
        <div class="card balance-card">
            <h4>Net Balance</h4>
            <p id="netBalance">Rs. 0.00</p>
        </div>
        <div class="card income-card">
            <h4>Total Income</h4>
            <p id="totalIncome">Rs. 0.00</p>
        </div>
        <div class="card expense-card">
            <h4>Total Expenses</h4>
            <p id="totalExpense">Rs. 0.00</p>
        </div>
    </div>

    <!-- Visual Progress Ratio Bar -->
    <div class="progress-container">
        <div class="progress-label-row">
            <span>Income vs Expense Ratio</span>
            <span id="ratioText">50% / 50%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-income" id="progIncome" style="width: 50%;"></div>
            <div class="progress-expense" id="progExpense" style="width: 50%;"></div>
        </div>
    </div>

    <!-- Main Content Layout -->
    <div class="main-layout">
        <!-- Add Transaction Form & Category Breakdown -->
        <div class="card-box">
            <h3>Add Transaction</h3>
            <form id="transactionForm" onsubmit="addTransaction(event)">
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="text" placeholder="e.g., Monthly Salary, Groceries" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Salary / Income">Salary / Income (Income)</option>
                        <option value="Food & Drinks">Food & Drinks (Expense)</option>
                        <option value="Bills & Utilities">Bills & Utilities (Expense)</option>
                        <option value="Transport">Transport (Expense)</option>
                        <option value="Shopping">Shopping (Expense)</option>
                        <option value="Other">Other (Expense)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (Rs.)</label>
                    <input type="number" id="amount" placeholder="e.g., 50000" min="1" step="0.01" required>
                </div>
                <button type="submit">Add Record</button>
            </form>

            <!-- Category-wise Summary -->
            <div class="category-breakdown">
                <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-main);">Expense Breakdown</h4>
                <div id="categorySummaryList">
                    <!-- Dynamic Breakdown -->
                </div>
            </div>
        </div>

        <!-- Transaction History Section -->
        <div class="card-box">
            <h3>Transaction History</h3>
            <ul id="list" class="transaction-list">
                <!-- Dynamic records -->
            </ul>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toastMsg">Success!</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('spendpulse_transactions')) || [
        { id: 1, text: "Monthly Salary", category: "Salary / Income", amount: 85000 },
        { id: 2, text: "Supermarket Groceries", category: "Food & Drinks", amount: -14500 },
        { id: 3, text: "Electricity & Water Bill", category: "Bills & Utilities", amount: -6500 }
    ];

    function showToast(message) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2400);
    }

    // Theme Toggle
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeToggle');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerText = '🌙 Dark Mode';
            localStorage.setItem('spendpulse_theme', 'light');
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️ Light Mode';
            localStorage.setItem('spendpulse_theme', 'dark');
        }
    }

    if (localStorage.getItem('spendpulse_theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').innerText = '☀️ Light Mode';
    }

    // AI Financial Advisor Logic
    function updateAIAdvisor(income, expense) {
        const aiText = document.getElementById('aiInsightText');
        if (transactions.length === 0) {
            aiText.innerText = "No financial data recorded yet. Add transactions to activate AI insights.";
            return;
        }

        if (income === 0) {
            aiText.innerText = "⚠️ Warning: No income recorded. Please add your income sources to track net balance accurately.";
            return;
        }

        const expenseRatio = (expense / income) * 100;

        if (expenseRatio <= 50) {
            aiText.innerText = `💡 Excellent savings rate! Your expenses account for only ${expenseRatio.toFixed(1)}% of your total income. Keep building your wealth.`;
        } else if (expenseRatio <= 80) {
            aiText.innerText = `⚖️ Balanced financial health. Expenses are at ${expenseRatio.toFixed(1)}% of your income. Maintain caution with non-essential shopping.`;
        } else {
            aiText.innerText = `⚠️ High Spending Alert! Expenses have reached ${expenseRatio.toFixed(1)}% of your total income. Immediate budget review recommended.`;
        }
    }

    // Category-wise Breakdown Calculation
    function updateCategoryBreakdown() {
        const catList = document.getElementById('categorySummaryList');
        catList.innerHTML = '';

        const expenses = transactions.filter(t => t.amount < 0);
        const totalExp = expenses.reduce((sum, t) => sum + Math.abs(t.amount), 0);

        const categories = ["Food & Drinks", "Bills & Utilities", "Transport", "Shopping", "Other"];
        
        let hasExpense = false;
        categories.forEach(cat => {
            const catTotal = expenses.filter(t => t.category === cat).reduce((sum, t) => sum + Math.abs(t.amount), 0);
            if (catTotal > 0) {
                hasExpense = true;
                const percent = totalExp > 0 ? ((catTotal / totalExp) * 100).toFixed(0) : 0;
                catList.innerHTML += `
                    <div class="cat-item">
                        <span>${cat}</span>
                        <strong>Rs. ${catTotal.toFixed(2)} (${percent}%)</strong>
                    </div>
                `;
            }
        });

        if (!hasExpense) {
            catList.innerHTML = `<span style="font-size: 12px; color: var(--text-muted);">No expense categories recorded yet.</span>`;
        }
    }

    function addTransaction(e) {
        e.preventDefault();
        
        const text = document.getElementById('text').value.trim();
        const category = document.getElementById('category').value;
        const amountVal = document.getElementById('amount').value;

        if (!text || !category || !amountVal) {
            alert('Please fill in all fields correctly.');
            return;
        }

        let rawAmount = Math.abs(parseFloat(amountVal));
        let finalAmount = category === 'Salary / Income' ? rawAmount : -rawAmount;

        const transaction = {
            id: Date.now(),
            text,
            category,
            amount: finalAmount
        };

        transactions.unshift(transaction);
        saveAndRefresh();
        showToast('✓ Transaction added successfully');

        document.getElementById('transactionForm').reset();
    }

    function removeTransaction(id) {
        if (confirm('Are you sure you want to delete this transaction?')) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRefresh();
            showToast('🗑️ Transaction removed');
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('spendpulse_transactions', JSON.stringify(transactions));
        init();
    }

    function updateValues() {
        const amounts = transactions.map(t => t.amount);
        
        const total = amounts.reduce((acc, item) => acc + item, 0).toFixed(2);
        const income = amounts.filter(item => item > 0).reduce((acc, item) => acc + item, 0);
        const expense = Math.abs(amounts.filter(item => item < 0).reduce((acc, item) => acc + item, 0));

        document.getElementById('netBalance').innerText = `Rs. ${total}`;
        document.getElementById('totalIncome').innerText = `Rs. ${income.toFixed(2)}`;
        document.getElementById('totalExpense').innerText = `Rs. ${expense.toFixed(2)}`;

        // Progress Ratio
        const totalFlow = income + expense;
        const progInc = document.getElementById('progIncome');
        const progExp = document.getElementById('progExpense');
        const ratioTxt = document.getElementById('ratioText');

        if (totalFlow === 0) {
            progInc.style.width = '50%';
            progExp.style.width = '50%';
            ratioTxt.innerText = `0% / 0%`;
        } else {
            const incPct = (income / totalFlow) * 100;
            const expPct = (expense / totalFlow) * 100;
            progInc.style.width = `${incPct}%`;
            progExp.style.width = `${expPct}%`;
            ratioTxt.innerText = `${incPct.toFixed(0)}% Income / ${expPct.toFixed(0)}% Expense`;
        }

        updateAIAdvisor(income, expense);
        updateCategoryBreakdown();
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';

        if (transactions.length === 0) {
            list.innerHTML = `<li style="text-align: center; color: var(--text-muted); padding: 30px;">No transactions recorded yet.</li>`;
            return;
        }

        transactions.forEach(t => {
            const sign = t.amount < 0 ? '-' : '+';
            const item = document.createElement('li');
            item.classList.add('transaction-item');
            item.classList.add(t.amount < 0 ? 'expense' : 'income');

            item.innerHTML = `
                <div class="trans-details">
                    <span class="trans-name">${t.text}</span>
                    <span class="trans-category">${t.category}</span>
                </div>
                <div class="trans-right">
                    <strong style="color: ${t.amount < 0 ? '#ef4444' : '#10b981'}">
                        ${sign}Rs. ${Math.abs(t.amount).toFixed(2)}
                    </strong>
                    <button class="delete-btn" onclick="removeTransaction(${t.id})">&times;</button>
                </div>
            `;
            list.appendChild(item);
        });
    }

    // Export to CSV
    function exportToCSV() {
        if (transactions.length === 0) {
            alert('No transactions available to export.');
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,Transaction ID,Description,Category,Amount (Rs.),Type\n";
        
        transactions.forEach((t, index) => {
            const type = t.amount > 0 ? "Income" : "Expense";
            csvContent += `${index + 1},"${t.text}","${t.category}",${t.amount.toFixed(2)},"${type}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "SpendPulse_Financial_Report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('📥 Financial report exported');
    }

    function init() {
        renderList();
        updateValues();
    }

    init();
</script>

</body>
</html>
